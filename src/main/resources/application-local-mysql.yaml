spring:
  datasource: # DB
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_LOCAL_URL}
    username: ${DB_LOCAL_USER}
    password: ${DB_LOCAL_PASSWORD}
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
