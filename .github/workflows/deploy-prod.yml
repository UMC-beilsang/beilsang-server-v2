name: Deploy to Production

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      #    - name: Run tests
      #      run: ./gradlew test
      #
      #    - name: Run checkstyle
      #      run: ./gradlew checkstyle

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Build Docker image
        run: |
          docker build -t beilsang-server:prod .

      - name: Save Docker image
        run: |
          docker save beilsang-server:prod | gzip > beilsang-server-prod.tar.gz

      - name: Deploy to Production Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "beilsang-server-prod.tar.gz,docker-compose.yml,docker-compose.prod.yml,nginx"
          target: "/home/${{ secrets.PROD_USER }}/deploy"

      - name: Run deployment on Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /home/${{ secrets.PROD_USER }}/deploy
            docker load < beilsang-server-prod.tar.gz

            # 환경변수 파일 생성
            cat > .env << EOF
            SPRING_PROFILES_ACTIVE=prod
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            DB_URL=${{ secrets.PROD_DB_URL }}
            DB_USER=${{ secrets.PROD_DB_USER }}
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            EOF

            # 필요한 디렉토리 생성
            mkdir -p logs certbot/conf certbot/www nginx/conf.d
            chown -R 1000:1000 logs
            chmod 755 logs

            # Docker Compose로 배포 (무중단 배포)
            docker-compose up -d --no-deps --build beilsang-server
            docker-compose up -d nginx certbot

            # 이전 이미지 정리
            docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            sleep 30
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Production deployment successful!"
