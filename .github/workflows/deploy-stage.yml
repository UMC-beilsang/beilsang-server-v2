name: Deploy to Stage

on:
  push:
    branches: [ dev ]

jobs:
  setup-make:
    name: Setup Make on Server
    runs-on: ubuntu-latest
    steps:
      - name: Install Make plugin if missing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            echo "🔍 Checking make installation..."

            if ! command -v make &> /dev/null; then
              echo "⚙️ Installing make..."
              sudo apt-get update
              sudo apt-get install -y make
            else
              echo "✅ make already installed."
            fi
            make --version
  setup-docker:
    name: Setup Docker on Server
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker plugin if missing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            echo "🔍 Checking docker installation..."

            if ! command -v docker &> /dev/null; then
              echo "⚙️ Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
            else
              echo "✅ Docker already installed."
            fi
            docker --version
  setup-docker-compose:
    name: Setup Docker Compose on Server
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker Compose plugin if missing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            echo "🔍 Checking docker compose installation..."
            if ! command -v docker compose &> /dev/null && ! command -v docker-compose &> /dev/null; then
              echo "⚙️ Installing docker compose..."
              sudo apt-get update
              sudo apt-get install docker-compose-plugin -y || \
              (sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose && sudo chmod +x /usr/local/bin/docker-compose)
            else
              echo "✅ Docker Compose already installed."
            fi
            docker compose version || docker-compose version
  setup-network:
    name: Setup Docker Network on Server
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Network if missing
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            echo "🌐 Checking if app-network exists..."
            if ! docker network ls | grep -q "app-network"; then
              echo "⚙️ Creating Docker network: app-network"
              docker network create app-network
            else
              echo "✅ Docker network 'app-network' already exists."
            fi

  deploy:
    runs-on: ubuntu-latest
    needs: setup-docker-compose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      #    - name: Run tests
      #      run: ./gradlew test
      #
      #    - name: Run checkstyle
      #      run: ./gradlew checkstyle

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Build Docker image
        run: |
          docker build -t beilsang-server:stage .

      - name: Save Docker image
        run: |
          docker save beilsang-server:stage | gzip > beilsang-server-stage.tar.gz

      - name: Deploy to Stage Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          source: "beilsang-server-stage.tar.gz,docker-compose.yml,docker-compose.stage.yml,nginx,Makefile"
          target: "/home/${{ secrets.STAGE_USER }}/deploy"

      - name: Run deployment on Stage Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            cd /home/${{ secrets.STAGE_USER }}/deploy
            docker load < beilsang-server-stage.tar.gz

            # 환경변수 파일 생성
            cat > .env << EOF
            SPRING_PROFILES_ACTIVE=stage
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            DB_URL=${{ secrets.STAGE_DB_URL }}
            DB_USER=${{ secrets.STAGE_DB_USER }}
            DB_PASSWORD=${{ secrets.STAGE_DB_PASSWORD }}
            EOF

            # 필요한 디렉토리 생성
            sudo mkdir -p logs certbot/conf certbot/www nginx/conf.d
            sudo chown -R 1000:1000 logs
            sudo chmod 755 logs

            # Docker Compose로 배포 (무중단 배포)
            make stage-deploy

            # 이전 이미지 정리
            docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            sleep 30
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Stage deployment successful!"
